<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Open Multiple URLs</title>
<script>
  function startOpening() {
    const urlsInput = document.getElementById('urlsInput').value.trim();
    const count = parseInt(document.getElementById('countInput').value);
    const delay = parseInt(document.getElementById('delayInput').value);
    const redirectUrl = document.getElementById('redirectInput').value.trim();
    const messageDiv = document.getElementById('popupMessage');

    // Validate inputs
    if (!urlsInput) {
      alert('Please enter at least one URL.');
      return;
    }
    if (isNaN(count) || count < 1 || count > 100) {
      alert('Please enter a number between 1 and 100 for the count.');
      return;
    }
    if (isNaN(delay) || delay < 0) {
      alert('Please enter a valid delay (milliseconds).');
      return;
    }

    // Parse URLs: split by new lines
    const urls = urlsInput.split('\n').map(u => u.trim()).filter(u => u);
    if (urls.length === 0) {
      alert('Please enter at least one valid URL.');
      return;
    }

    // Reset message
    messageDiv.textContent = '';

    // Check if popups are blocked with a test window
    const testWindow = window.open('', '_blank');
    if (!testWindow || testWindow.closed || typeof testWindow.closed === 'undefined') {
      messageDiv.textContent = 'Popups are blocked. Please allow popups for this site.';
      return;
    } else {
      testWindow.close();
    }

    let urlIndex = 0;
    let totalToOpen = count * urls.length;
    let openedCount = 0;

    function openNext() {
      if (openedCount >= totalToOpen) {
        // All done, replace this tab with the user's chosen URL
        setTimeout(() => {
          const targetUrl = redirectUrl || 'https://www.google.com';
          window.location.replace(targetUrl);
        }, 500); // Slight delay to ensure the last window command registers
        return;
      }
      // Select URL cyclically
      const url = urls[urlIndex % urls.length];
      window.open(url, '_blank');
      openedCount++;
      urlIndex++;
      setTimeout(openNext, delay);
    }

    openNext();
  }
</script>
</head>
<body>
  <h1>Open Multiple URLs</h1>
  <label for="urlsInput">Enter URLs (each on a new line):</label><br/>
  <textarea id="urlsInput" rows="6" cols="60" placeholder="https://example.com&#10;https://another.com"></textarea><br/><br/>

  <label for="countInput">Number of times to open each URL (1-100):</label>
  <input type="number" id="countInput" min="1" max="100" value="10" /><br/><br/>

  <label for="delayInput">Delay between opens (ms):</label>
  <input type="number" id="delayInput" min="0" value="500" /><br/><br/>

  <label for="redirectInput">When all tabs are opened, this tab will turn into:</label><br/>
  <input type="text" id="redirectInput" size="60" placeholder="https://www.google.com" value="https://www.google.com" /><br/><br/>

  <button onclick="startOpening()">Start</button>
  <p id="popupMessage" style="color: red; font-weight: bold;"></p>
  <p>Make sure popups are allowed for this site.</p>
</body>
</html>
